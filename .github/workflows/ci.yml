name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test
        run: >-
          xcodebuild -project CodexThemeBar.xcodeproj
          -scheme CodexThemeBar -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build test
